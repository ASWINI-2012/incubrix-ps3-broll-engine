openapi: 3.1.0
info:
  title: IncuBrix Script-to-B-roll Video Engine
  version: 0.1.0
  description: Create narrated MP4 videos from scripts, narration audio, or manual scenes.
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/media:
    get:
      tags: [media]
      summary: Get the local media catalogue and actual storage/count summary
      responses:
        '200': { description: Media catalogue }
  /api/v1/media/scan:
    post:
      tags: [media]
      summary: Scan and validate local media
      responses:
        '200': { description: Updated media catalogue }
  /api/v1/media/{media_id}/file:
    get:
      tags: [media]
      summary: Stream a validated local catalogue item
      parameters:
        - in: path
          name: media_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Local image or video }
        '404': { description: Item not found }
  /api/v1/media/download:
    post:
      tags: [media]
      summary: Preview or run a bounded Pexels media collection
      parameters:
        - in: query
          name: dry_run
          schema: { type: boolean, default: true }
        - in: query
          name: max_assets
          schema: { type: integer, minimum: 0, maximum: 100, default: 20 }
      responses:
        '200': { description: Actual collection summary and failures }
        '422': { description: Invalid bounds }
  /api/v1/broll/jobs:
    post:
      tags: [jobs]
      summary: Create an asynchronous video job
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 200
        - in: header
          name: X-Request-ID
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
          multipart/form-data:
            schema:
              type: object
              properties:
                script:
                  type: string
                audio_url:
                  type: string
                  format: uri
                audio:
                  type: string
                  format: binary
                scenes:
                  type: string
                  description: JSON array of scene objects
                aspect_ratios:
                  type: string
                  description: JSON array of aspect ratio strings
                captions_enabled:
                  type: boolean
                visual_style:
                  type: string
                voice:
                  type: string
                avoid:
                  type: string
                  description: JSON array of terms
                title:
                  type: string
      responses:
        "202":
          description: Job accepted or existing idempotent job returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "409":
          description: Idempotency key was reused with a different request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Audio upload exceeds configured size limit
        "415":
          description: Unsupported request or audio format
        "422":
          description: Invalid job input
  /api/v1/jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get job status and result links
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{job_id}/result:
    get:
      tags: [jobs]
      summary: Get completed video metadata and links
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Result metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job has not completed successfully
  /api/v1/jobs/{job_id}/timeline:
    get:
      tags: [jobs]
      summary: Get scene timing and selected footage provenance
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Scene timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Timeline is available after successful completion
  /api/v1/jobs/{job_id}/files/{filename}:
    get:
      tags: [jobs]
      summary: Download an allow-listed job artifact
      parameters:
        - $ref: "#/components/parameters/JobId"
        - in: path
          name: filename
          required: true
          schema:
            type: string
            enum: [captions.srt, manifest.json, timeline.json, narration.wav, narration.mp3, narration.m4a, video_16x9.mp4, video_9x16.mp4, video_1x1.mp4]
      responses:
        "200":
          description: Job artifact
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job files are available after successful completion
  /health:
    get:
      tags: [system]
      summary: Check API process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
  /api/v1/voices:
    get:
      tags: [system]
      summary: List available local text-to-speech voices
      responses:
        "200":
          description: Local voice names and identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        "503":
          description: Local text-to-speech is unavailable
  /ready:
    get:
      tags: [system]
      summary: Check required rendering tools and footage provider configuration
      responses:
        "200":
          description: Rendering tools are available; the selected provider and credential status are reported
        "503":
          description: A required local rendering tool is missing
components:
  parameters:
    JobId:
      in: path
      name: job_id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Job was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    JobInput:
      type: object
      additionalProperties: false
      properties:
        script:
          type: string
          maxLength: 20000
        audio_url:
          type: string
          format: uri
          description: HTTPS URL; local/private network destinations and redirects are rejected.
        scenes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SceneInput"
        aspect_ratios:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AspectRatio"
        captions_enabled:
          type: boolean
          default: true
        voice:
          type: string
          maxLength: 100
        visual_style:
          type: string
          enum: [documentary, cinematic, educational, business]
          default: documentary
        avoid:
          type: array
          maxItems: 30
          items:
            type: string
        title:
          type: string
          maxLength: 200
      anyOf:
        - required: [script]
        - required: [scenes]
        - required: [audio_url]
      allOf:
        - not:
            required: [script, scenes]
        - not:
            required: [script, audio_url]
    SceneInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        duration_seconds:
          type: number
          exclusiveMinimum: 0
          maximum: 600
        search_query:
          type: string
          maxLength: 200
    AspectRatio:
      type: string
      enum: ["16:9", "9:16", "1:1"]
    JobStatus:
      type: object
      required: [job_id, status, progress, current_stage, created_at]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        current_stage:
          type: string
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/JobResult"
            - type: "null"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
    JobResult:
      type: object
      properties:
        job_id:
          type: string
        videos:
          type: array
          items:
            type: object
            required: [file, width, height, duration_seconds, url]
            properties:
              file:
                type: string
              width:
                type: integer
              height:
                type: integer
              duration_seconds:
                type: number
              video_codec:
                type: string
              audio_codec:
                type: string
              url:
                type: string
        captions:
          type: string
        captions_url:
          type: string
        timeline_url:
          type: string
        manifest_url:
          type: string
        narration:
          type: string
        narration_url:
          type: string
        provider:
          type: string
        license_note:
          type: string
        created_at:
          type: string
          format: date-time
    Timeline:
      type: object
      properties:
        job_id:
          type: string
        narration_duration_seconds:
          type: number
        timing_method:
          type: string
        matching_method:
          type: string
        scenes:
          type: array
          items:
            type: object
            properties:
              scene_id:
                type: string
              text:
                type: string
              start_time:
                type: number
              end_time:
                type: number
              duration_seconds:
                type: number
              search_query:
                type: string
              clip:
                type: object
                properties:
                  provider:
                    type: string
                  asset_id:
                    type: string
                  source_url:
                    type: string
                  license_url:
                    type: string
                  relevance_score:
                    type: number
                  selection_reason:
                    type: string
    JobError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
